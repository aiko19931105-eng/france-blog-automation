name: carousel-discord

on:
  schedule:
    - cron: "0 0 * * 4"   # 木曜 UTC 0:00 = JST 9:00
    - cron: "0 0 * * 0"   # 日曜 UTC 0:00 = JST 9:00
  workflow_dispatch:

jobs:
  generate-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: フォントインストール
        run: sudo apt-get install -y fonts-noto-cjk
      - name: パッケージインストール
        run: pip install anthropic requests Pillow
      - name: カルーセル生成・Discord送信
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:            ${{ secrets.WP_URL }}
          WP_USER:           ${{ secrets.WP_USER }}
          WP_APP_PASS:       ${{ secrets.WP_APP_PASS }}
          DISCORD_WEBHOOK:   ${{ secrets.DISCORD_WEBHOOK }}
          UNSPLASH_KEY:      ${{ secrets.UNSPLASH_KEY }}
        run: python carousel_to_discord.py
